[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2021"
description = "A Claude Code status line showing context window fill and prompt cache expiry countdown"
license = "MIT"
homepage = "https://github.com/lukaprsina/claude-statusline"
repository = "https://github.com/lukaprsina/claude-statusline"
documentation = "https://github.com/lukaprsina/claude-statusline#readme"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
